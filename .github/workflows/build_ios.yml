name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd device_tracking
          flutter pub get

      - name: Build iOS (No Codesign)
        run: |
          cd device_tracking
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          cd device_tracking
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qr device_tracking.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: device_tracking_ipa
          path: device_tracking/build/ios/ipa/device_tracking.ipa
