workflows:
  ios-release:
    name: iOS Release IPA (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Disable SPM
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Set up Flutter dependencies
        script: |
          cd device_tracking
          flutter packages pub get
      - name: Build iOS (No Codesign)
        script: |
          cd device_tracking
          flutter build ios --release --no-codesign
      - name: Package to IPA
        script: |
          cd device_tracking
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry device_tracking.ipa Payload
    artifacts:
      - device_tracking/build/ios/ipa/*.ipa

  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Admin"
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Disable SPM
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Set up Flutter dependencies
        script: |
          cd device_tracking
          flutter packages pub get
          flutter build ios --config-only
      - name: Set up code signing
        script: |
          keychain initialize
          ssh-keygen -t rsa -b 2048 -m PEM -f /Users/builder/cert_key -q -N ""
          app-store-connect fetch-signing-files "com.alwafa.deviceTracking" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/Users/builder/cert_key
          keychain add-certificates --certificate-key=/Users/builder/cert_key
      - name: Build iOS IPA for App Store
        script: |
          cd device_tracking
          flutter build ios --release --no-codesign
          cd ios
          xcode-project use-profiles --archive-method app-store --export-options-plist /Users/builder/export_options.plist --code-signing-setup-verbose-logging
          xcode-project build-ipa \
            --workspace Runner.xcworkspace \
            --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
      - device_tracking/build/ios/ipa/*.ipa
      - /Users/builder/clone/build/ios/ipa/*.ipa
      - /Users/builder/clone/device_tracking/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

