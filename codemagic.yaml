workflows:
  ios-release:
    name: iOS Release IPA (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
    # Unsigned release IPA (trigger manually from Codemagic dashboard if needed)
    triggering:
      events: []
    scripts:
      - name: Disable SPM
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Set up Flutter dependencies
        script: |
          cd device_tracking
          flutter packages pub get
      - name: Build iOS (No Codesign)
        script: |
          cd device_tracking
          flutter build ios --release --no-codesign
      - name: Package to IPA
        script: |
          cd device_tracking
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry device_tracking.ipa Payload
    artifacts:
      - device_tracking/build/ios/ipa/*.ipa

  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic Admin"
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Disable SPM
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Set up Flutter dependencies
        script: |
          cd device_tracking
          flutter packages pub get
          flutter build ios --config-only
      - name: Set up code signing
        script: |
          keychain initialize
          python3 -c "import base64; open('/Users/builder/cert_key', 'wb').write(base64.b64decode(open('$CM_BUILD_DIR/device_tracking/ios/certs/cert_key.b64').read().strip()))"
          chmod 600 /Users/builder/cert_key
          app-store-connect fetch-signing-files "com.alwafa.deviceTracking" \
            --type IOS_APP_STORE \
            --strict-match-identifier \
            --create \
            --certificate-key=@file:/Users/builder/cert_key
          keychain add-certificates
      - name: Build iOS IPA for App Store
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number --bundle-id "com.alwafa.deviceTracking" 2>/dev/null || echo "1")
          if ! [[ "$LATEST_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            LATEST_BUILD_NUMBER=1
          fi

          CM_BN=${BUILD_NUMBER:-2}
          if ! [[ "$CM_BN" =~ ^[0-9]+$ ]]; then
            CM_BN=2
          fi

          if [ "$CM_BN" -gt "$LATEST_BUILD_NUMBER" ]; then
            NEXT_BUILD_NUMBER=$CM_BN
          else
            NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          fi

          if [ "$NEXT_BUILD_NUMBER" -le 1 ]; then
            NEXT_BUILD_NUMBER=2
          fi

          echo "========================================="
          echo "Previous TestFlight Build Number: $LATEST_BUILD_NUMBER"
          echo "Codemagic Build Index: $CM_BN"
          echo "Calculated New Build Number: $NEXT_BUILD_NUMBER"
          echo "========================================="

          cd device_tracking
          flutter build ios --release --no-codesign --build-number=$NEXT_BUILD_NUMBER
          cd ios
          agvtool new-version -all $NEXT_BUILD_NUMBER || true
          xcode-project use-profiles --archive-method app-store --export-options-plist /Users/builder/export_options.plist --code-signing-setup-verbose-logging
          xcode-project build-ipa \
            --workspace Runner.xcworkspace \
            --scheme Runner \
            --ipa-directory /Users/builder/clone/build/ios/ipa
          cd /Users/builder/clone/build/ios/ipa
          for f in *.ipa; do
            if [ -f "$f" ] && [ "$f" != "DeviceTracking.ipa" ]; then
              mv "$f" "DeviceTracking.ipa"
            fi
          done
          ls -la /Users/builder/clone/build/ios/ipa
    artifacts:
      - /Users/builder/clone/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

