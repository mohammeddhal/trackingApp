workflows:
  ios-release:
    name: iOS Release IPA (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Set up Flutter dependencies
        script: |
          cd device_tracking
          flutter packages pub get
      - name: Build iOS (No Codesign)
        script: |
          cd device_tracking
          flutter build ios --release --no-codesign
      - name: Package to IPA
        script: |
          cd device_tracking
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qr device_tracking.ipa Payload
    artifacts:
      - device_tracking/build/ios/ipa/*.ipa
