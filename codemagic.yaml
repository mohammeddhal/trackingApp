workflows:
  ios-release:
    name: iOS Release IPA (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Disable SPM
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Set up Flutter dependencies
        script: |
          cd device_tracking
          flutter packages pub get
      - name: Build iOS (No Codesign)
        script: |
          cd device_tracking
          flutter build ios --release --no-codesign
      - name: Package to IPA
        script: |
          cd device_tracking
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry device_tracking.ipa Payload
    artifacts:
      - device_tracking/build/ios/ipa/*.ipa

  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Disable SPM
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.alwafa.deviceTracking" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set up Flutter dependencies
        script: |
          cd device_tracking
          flutter packages pub get
      - name: Pod install
        script: |
          cd device_tracking/ios
          pod install
      - name: Build iOS IPA for App Store
        script: |
          cd device_tracking
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - device_tracking/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

